[project]
name = "lablens"
version = "0.1.0"
description = "中文检验报告智能体：数值判定交给确定性代码，语言解释交给 LLM，没有参考区间就拒绝判断"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Runze Yang" }]
keywords = ["medical-ai", "laboratory-report", "llm", "rag", "constrained-retrieval", "chinese"]

dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# 趋势存储：默认关闭，需要时再装
trend = ["duckdb>=1.0"]
# Streamlit 界面
app = ["streamlit>=1.36", "plotly>=5.22", "pandas>=2.2"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]
all = ["lablens[trend,app,dev]"]

[project.urls]
Homepage = "https://github.com/yang-rz-602/lablens"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "core.providers"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "SIM108"]
