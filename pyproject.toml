[project]
name = "lablens"
version = "0.1.0"
description = "中文检验报告智能体：数值判定交给确定性代码，语言解释交给 LLM，没有参考区间就拒绝判断"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Runze Yang" }]
keywords = ["medical-ai", "laboratory-report", "llm", "rag", "constrained-retrieval", "chinese"]

dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    # ---- LLM 层：LangChain 官方 OpenAI 集成 ----
    # 全部内置供应商（通义千问 / 智谱 / SiliconFlow / OpenAI / DeepSeek / 本地 vLLM）
    # 都提供 OpenAI 兼容端点，因此一套 ChatOpenAI + base_url 即可覆盖，
    # 不再手写 HTTP 请求与重试逻辑。
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    # ---- 检索层：混合召回 + 重排 + 向量库 ----
    # langchain-classic 提供 EnsembleRetriever / ContextualCompressionRetriever
    # （LangChain 1.x 把这两者从 langchain.retrievers 移到了 langchain-classic）
    "langchain>=1.0,<2",
    "langchain-classic>=1.0,<2",
    "langchain-community>=0.4,<0.5",
    "faiss-cpu>=1.9",
    "rank-bm25>=0.2",
    # DashScope：embedding（text-embedding-v4）与交叉编码器重排（gte-rerank-v2）
    "dashscope>=1.20",
]

[project.optional-dependencies]
# 趋势存储：默认关闭，需要时再装
trend = ["duckdb>=1.0"]
# Streamlit 界面
app = ["streamlit>=1.36", "plotly>=5.22", "pandas>=2.2"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]
all = ["lablens[trend,app,dev]"]

[project.urls]
Homepage = "https://github.com/yang-rz-602/lablens"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "core.providers", "ui"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "SIM108"]
