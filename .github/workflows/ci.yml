name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试与评测（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 代码风格检查
        run: ruff check .

      - name: 单元测试
        run: pytest -q

      # 这一步是本仓库的关键区别：CI 不只看测试过不过，
      # 还要求「危急值漏报为 0」——把安全指标做成回归闸门，
      # 而不是只写在 README 里。
      - name: 安全闸门（危急值漏报必须为 0）
        run: python evals/run_eval.py --gate

      - name: 校验评测报告与代码一致
        run: |
          python evals/run_eval.py --write
          git diff --exit-code evals/RESULTS.md \
            || (echo "::error::evals/RESULTS.md 与当前代码不一致，请本地运行 python evals/run_eval.py --write 后提交" && exit 1)

  mcp-smoke:
    name: MCP 协议冒烟测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: 用真实 stdio 握手一次
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"judge_lab_items","arguments":{"items":[{"name":"钾","result":"6.8","unit":"mmol/L","reference":"3.5-5.3"}],"sex":"M"}}}' \
            | python mcp_server.py > mcp_out.jsonl
          cat mcp_out.jsonl
          grep -q '"name": "lablens"' mcp_out.jsonl
          grep -q '"flag": "CH"' mcp_out.jsonl
          echo "MCP server 握手、工具枚举与危急值判读均正常"
