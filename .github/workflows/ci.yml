name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试与评测（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # LangChain 栈 + FAISS 都在必需依赖里，这一步即包含完整检索能力
          pip install -e ".[app,dev]"

      # CI 刻意**不配置任何 API Key**：整条链路（判读 + 检索 + 重排 + 解释 + 护栏）
      # 必须能在离线状态下跑通，这是本项目的硬约束之一。
      # 这意味着 CI 实际覆盖的是 BM25 + 确定性重排的降级路径；
      # 向量检索与 DashScope 重排的装配则由 tests/test_rag.py 用注入的假向量离线覆盖。

      - name: 代码风格检查
        run: ruff check .

      - name: 单元测试
        run: pytest -q

      # 这一步是本仓库的关键区别：CI 不只看测试过不过，
      # 还要求「危急值漏报为 0」——把安全指标做成回归闸门，
      # 而不是只写在 README 里。
      - name: 安全闸门（危急值漏报必须为 0）
        run: python evals/run_eval.py --gate

      - name: 校验评测报告与代码一致
        run: |
          python evals/run_eval.py --write
          git diff --exit-code evals/RESULTS.md \
            || (echo "::error::evals/RESULTS.md 与当前代码不一致，请本地运行 python evals/run_eval.py --write 后提交" && exit 1)

  mcp-smoke:
    name: MCP 协议冒烟测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: 用真实 stdio 握手一次
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"judge_lab_items","arguments":{"items":[{"name":"钾","result":"6.8","unit":"mmol/L","reference":"3.5-5.3"}],"sex":"M"}}}' \
            | python mcp_server.py > mcp_out.jsonl
          cat mcp_out.jsonl

          # 用脚本解析而不是 grep。MCP 把工具结果作为**字符串**放在
          # result.content[0].text 里，原始输出中是转义形态（\"flag\": \"CH\"），
          # 所以 `grep '"flag": "CH"'` 永远匹配不上——这条断言从仓库建立起
          # 就一直红着（历史 8 次运行全部在此失败，而主矩阵一直绿）。
          python scripts/check_mcp_smoke.py mcp_out.jsonl
