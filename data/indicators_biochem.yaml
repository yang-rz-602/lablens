# LabLens 结构化指标字典 —— 生化 / 免疫 / 凝血部分
#
# 用途：作为 core.rules 规则引擎的"内置知识库"（RefSource.KNOWLEDGE_BASE），
#       当报告单本身没有印参考区间，或需要判定危急值时使用。
#
# 数据来源优先级：
#   1. WS/T 404 系列《临床常用生化检验项目参考区间》（中国卫生行业标准）
#        - WS/T 404.1-2012  本次采用：ALT / AST / GGT / ALP / TBIL / DBIL / IBIL / TP / ALB
#        - WS/T 404.2-2012  本次采用：CREA / UA
#        - WS/T 404.3-2012  本次采用：TC / TG / HDL-C / LDL-C / APOA1 / APOB / Lp(a)
#      （注意：WS/T 404 各分册采用"双侧 95% 分布区间"的下/上限，与厂商说明书
#        及多数医院 LIS 打印区间可能存在小幅差异，属正常现象。）
#   2. 无对应卫生行业标准的项目，标注 "临床检验操作规程/各院检验科公示区间"。
#
# 字段约定：
#   ref.default  —— 通用区间；未标注性别的报告使用它
#   ref.M / ref.F —— 仅当男女区间不同才写；女性专属/男性专属项目另一方写 null
#   ref.* 的 low 为 null 表示只有上限（如 eGFR、HDL-C、Lp(a)、ESR 的"≤"型区间）
#   critical    —— 危急值阈值；null 表示该项目无公认危急值标准，不得推断
#   qualitative —— 是否为定性项目（本文件全部为定量项目，均为 false）
#
# 免责声明：本字典仅用于检验结果的机械判定（H/L/危急），不构成诊断依据。
# 各医疗机构应以本机构 LIS 打印区间为最终准绳（RefSource.REPORT 优先）。

