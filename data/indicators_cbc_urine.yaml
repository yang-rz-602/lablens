# LabLens 结构化指标字典 —— 血常规 / 尿常规
#
# 参考区间来源：
#   - 血常规：WS/T 405-2012《血细胞分析参考区间》表1（中国成年人，静脉血仪器法）。
#     该标准表1 共 18 项，止于血小板计数(PLT)，**未纳入 RDW-CV 与 MPV**，
#     这两项改用临床检验操作规程/各院检验科公示区间。
#   - 尿常规：无对应卫生行业标准，来源为临床检验操作规程/各院检验科公示区间。
#   - 按性别分层的项目（rbc/hgb/hct）同时给出 default/M/F；default 为男女区间并集，
#     仅在性别未知时兜底，性别已知时必须使用 M/F。
#   - critical 为危急值阈值；无公认阈值者填 null，不做推测。

- canonical_name: wbc
  name_zh: "白细胞计数"
  aliases: ["WBC", "白细胞", "白细胞计数", "WBCC", "WBC计数", "白血球", "白细胞总数", "WBC总数"]
  loinc: "6690-2"
  category: "血常规"
  specimen: "全血"
  unit_canonical: "10^9/L"
  decimals: 1
  qualitative: false
  ref:
    default: {low: 3.5, high: 9.5}
  critical: {low: 1.5, high: 30.0}
  unit_conversions:
    - {from: "10^3/uL", factor: 1.0}
    - {from: "K/uL", factor: 1.0}
    - {from: "/uL", factor: 0.001}
  source: "WS/T 405-2012"
  note: "危急值下限各院不一致（常见 1.5~2.5×10^9/L），上限 30×10^9/L 较为一致；新生儿及儿童白细胞计数随年龄变化明显，本区间仅适用于成年人。"

